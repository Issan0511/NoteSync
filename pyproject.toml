[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beamerplus"
version = "0.2.4"
description = "A handwritten notebook for Samsung S Pen with Claude Sonnet assistance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "pymupdf>=1.22.0",
    "websockets>=12.0",
    "qrcode>=7.0",
    "pillow>=9.0",
    "ziamath>=0.13,<0.14",
    "latex2mathml>=3.81,<4",
]

[project.optional-dependencies]
mcp = ["mcp>=1.26,<2"]

[project.scripts]
beamerplus = "beamerplus.main:main"
beamerplus-mcp = "beamerplus.NotebookMCP:main"
beamerplus-export = "beamerplus.NotebookSources:main"

[project.gui-scripts]
beamerplus-gui = "beamerplus.main:main"

[tool.setuptools.packages.find]
include = ["beamerplus*"]
