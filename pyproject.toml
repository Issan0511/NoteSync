[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "notesync"
version = "0.3.0"
description = "Handwritten notebooks, storage and live synchronization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "pymupdf>=1.22.0",
    "websockets>=12.0",
    "qrcode>=7.0",
    "pillow>=9.0",
    "ziamath>=0.13,<0.14",
    "latex2mathml>=3.81,<4",
]

[project.optional-dependencies]
mcp = ["mcp>=1.26,<2"]

[project.scripts]
notesync = "notesync.main:main"
notesync-mcp = "notesync.NotebookMCP:main"
notesync-export = "notesync.NotebookSources:main"

[project.gui-scripts]
notesync-gui = "notesync.main:main"

[tool.setuptools.packages.find]
include = ["notesync*"]
